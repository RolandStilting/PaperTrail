name: PaperTrail

options:
  bundleIdPrefix: nl.rolandstilting
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer Team ID (Membership details on developer.apple.com).
    DEVELOPMENT_TEAM: "67YRLXTX42"
    # The bundle ID. The iCloud container is iCloud.<bundle ID>; it is derived automatically
    # everywhere except the NSUbiquitousContainers key below (Xcode does not expand keys).
    # Change both together; ICloudContainerConfigTests fails if they differ.
    PAPERTRAIL_BUNDLE_ID: nl.rolandstilting.papertrail

packages:
  PaperTrailKit:
    path: PaperTrailKit

targets:
  PaperTrail:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PaperTrail
    dependencies:
      - package: PaperTrailKit
    info:
      path: PaperTrail/Resources/Info.plist
      properties:
        CFBundleDisplayName: Paper Trail
        NSCameraUsageDescription: Paper Trail uses the camera to scan receipts, invoices and letters.
        UIBackgroundModes: [remote-notification]
        PTICloudContainerIdentifier: iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        NSUbiquitousContainers:
          # Must be iCloud.<PAPERTRAIL_BUNDLE_ID>, written out in full.
          iCloud.nl.rolandstilting.papertrail:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Paper Trail
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PAPERTRAIL_BUNDLE_ID)
        PRODUCT_NAME: Paper Trail
        PRODUCT_MODULE_NAME: PaperTrail
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: PaperTrail/Resources/PaperTrail-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: PaperTrail/Resources/PaperTrail-macOS.entitlements

  PaperTrailTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PaperTrailTests
    dependencies:
      - target: PaperTrail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PAPERTRAIL_BUNDLE_ID).tests
        TEST_HOST[sdk=iphone*]: "$(BUILT_PRODUCTS_DIR)/Paper Trail.app/Paper Trail"
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Paper Trail.app/Contents/MacOS/Paper Trail"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PaperTrail:
    build:
      targets:
        PaperTrail: all
        PaperTrailTests: [test]
    test:
      targets:
        - PaperTrailTests
